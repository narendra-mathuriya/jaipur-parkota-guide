var selectedCategory = "all";

function norm(s) {
  if (!s) return "";
  return s.toLowerCase()
    .replace(/ee/g, "i")
    .replace(/oo/g, "u")
    .replace(/ou/g, "u")
    .replace(/ph/g, "f")
    .replace(/sh/g, "s")
    .replace(/kh/g, "k")
    .replace(/bh/g, "b")
    .replace(/dh/g, "d")
    .replace(/th/g, "t")
    .replace(/ch/g, "c")
    .replace(/jh/g, "j")
    .replace(/w/g, "v")
    .replace(/aa/g, "a")
    .replace(/bel/g, "ble")
    .trim();
}

for (var i = 0; i < D.length; i++) {
  var item = D[i];
  var rawText = (item.id + " " + item.n + " " + item.i + " " + item.a + " " + item.s + " " + item.en).toLowerCase();
  item._raw = rawText;
  item._norm = norm(rawText);
}

function render(data) {
  var list = document.getElementById("list");
  var st = document.getElementById("st");
  var noResult = document.getElementById("noResult");
  if (!list) return;

  var html = "";
  for (var k = 0; k < data.length; k++) {
    var itm = data[k];
    html += '<div class="card">' +
      '<div>' +
        '<div class="card-head">' +
          '<span class="card-title">' + itm.id + '. ' + itm.n + '</span>' +
          '<span class="card-area">' + itm.a + '</span>' +
        '</div>' +
        '<div class="card-body">' +
          '<div class="card-row"><span class="card-lbl">मुख्य विशेषता / क्या मिलेगा:</span> ' + itm.i + '</div>' +
          '<div class="card-row"><span class="card-lbl">प्रसिद्ध नाम / स्पॉट:</span> ' + itm.s + '</div>' +
        '</div>' +
      '</div>' +
      '<a class="map-btn" href="https://www.google.com/maps/search/?api=1&query=' + itm.q + '" target="_blank" rel="noopener">📍 Google Maps पर देखें</a>' +
    '</div>';
  }
  list.innerHTML = html;
  if (st) st.innerText = data.length + " / " + D.length + " स्थान";
  if (noResult) noResult.style.display = (data.length === 0) ? "block" : "none";
}

function applyFilters() {
  var sb = document.getElementById("sb");
  var cb = document.getElementById("cb");
  var query = sb ? sb.value.trim() : "";
  if (cb) cb.style.display = query.length > 0 ? "inline-flex" : "none";

  var rawTokens = query ? query.toLowerCase().split(" ").filter(Boolean) : [];
  var normTokens = query ? norm(query).split(" ").filter(Boolean) : [];
  var matched = [];

  for (var i = 0; i < D.length; i++) {
    var itm = D[i];

    // Category filter check
    if (selectedCategory !== "all" && itm.cats.indexOf(selectedCategory) === -1) {
      continue;
    }

    // Keyword search check
    if (rawTokens.length > 0) {
      var isMatch = true;
      for (var t = 0; t < rawTokens.length; t++) {
        var rTok = rawTokens[t];
        var nTok = normTokens[t] || rTok;

        var tokenMatches = (itm._raw.indexOf(rTok) !== -1) || (itm._norm.indexOf(nTok) !== -1);
        if (!tokenMatches) {
          isMatch = false;
          break;
        }
      }
      if (!isMatch) continue;
    }

    matched.push(itm);
  }

  render(matched);
}

function filterCat(cat, btnElem) {
  selectedCategory = cat;
  var buttons = document.querySelectorAll("#catBar .cat-btn");
  for (var b = 0; b < buttons.length; b++) {
    buttons[b].classList.remove("active");
  }
  if (btnElem) {
    btnElem.classList.add("active");
  }
  applyFilters();
}

function resetSearch() {
  var sb = document.getElementById("sb");
  if (!sb) return;
  sb.value = "";
  sb.focus();
  applyFilters();
}

function dlHTML() {
  var blob = new Blob([document.documentElement.outerHTML], { type: "text/html;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "Jaipur_Complete_85_Places_Guide.html";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// Bind search input events
var searchInput = document.getElementById("sb");
if (searchInput) {
  searchInput.addEventListener("input", applyFilters);
  searchInput.addEventListener("keyup", applyFilters);
  searchInput.addEventListener("paste", function() { setTimeout(applyFilters, 10); });
}

// Initial render
render(D);
</script>
